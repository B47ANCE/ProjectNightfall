name: Offline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline Python and Lua (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.12.14'
          - os: windows-2022
            python: '3.12.10'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install hash-locked host interpreter
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r tests/requirements-ci.txt
      - name: Prepare public commit-pinned fixtures
        run: python scripts/prepare_ci_dependencies.py
      - name: Current version mirrors
        run: python scripts/check_versions.py
      - name: Python regression and disposable packaging tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Lua host regressions
        run: python scripts/run_host_tests.py --dependencies .local/ci-dependencies
      - name: Source, case, localization, Lua-only and public index audit
        run: python scripts/audit_project.py --dependencies .local/ci-dependencies --output .local/source-audit.json
      - name: Verify fixture immutability after tests
        run: python scripts/prepare_ci_dependencies.py --check
      - name: Evidence boundary
        run: echo "Offline checks only. SP and dedicated NOT TESTED. G7 and stable G8 BLOCKED. No package build, deploy, upload or cleanup."
